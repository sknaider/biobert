[metadata]
name = biobert
version = 1.2.0
description = BioBERT: a pre-trained biomedical language representation model for biomedical text mining
long_description = file: README.md
long_description_content_type = text/markdown
author = DMIS Lab
author_email = dmis.korea@gmail.com
license = Apache-2.0
url = https://github.com/dmis-lab/biobert
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Scientific/Engineering :: Bio-Informatics

[options]
python_requires = >=3.8
install_requires =
    tensorflow>=2.13.0,<2.14.0
    scikit-learn>=1.3.0,<1.4.0
    pandas>=2.0.0,<2.2.0
    numpy>=1.24.0,<1.27.0

[options.extras_require]
dev =
    pytest>=7.4.0
    pytest-cov>=4.1.0
    pytest-xdist>=3.3.0
    mypy>=1.5.0
    black>=23.7.0
    flake8>=6.1.0
    isort>=5.12.0
    bandit>=1.7.5
    pre-commit>=3.3.0

# Flake8 configuration
[flake8]
max-line-length = 100
extend-ignore = E203, E266, E501, W503
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    .eggs,
    *.egg,
    build,
    dist,
    .pytest_cache,
    .mypy_cache,
    data,
    models,
    output
max-complexity = 10
per-file-ignores =
    __init__.py:F401
    *_test.py:D100,D101,D102,D103

# isort configuration
[isort]
profile = black
line_length = 100
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
skip =
    .git,
    __pycache__,
    .venv,
    venv,
    .eggs,
    *.egg,
    build,
    dist

# pytest configuration
[tool:pytest]
minversion = 7.0
testpaths = .
python_files = *_test.py test_*.py
python_classes = Test* *Test
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=.
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml
    -v
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests

# Coverage configuration
[coverage:run]
source = .
omit =
    *_test.py
    */tests/*
    setup.py
    */site-packages/*
    __pycache__/*
    .venv/*
    venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
precision = 2
show_missing = True

[coverage:html]
directory = htmlcov

# mypy configuration
[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
follow_imports = normal
ignore_missing_imports = True

# Bandit configuration
[bandit]
exclude = /tests,/test,*_test.py
skips = B101,B601
